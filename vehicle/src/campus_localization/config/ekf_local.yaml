# ekf_local —— 局部链：轮速 + IMU 递推（odom→base_link，与 map 无关，连续高频）
# robot_localization ekf_node；噪声参数 W3 起按实车标定修订（SOP 第 0 步底盘标定）
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true            # 校园低速车，平面运动

    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,   # x/y 速度
                   false, false, true,    # yaw rate
                   false, false, false]
    odom0_differential: false

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,     # yaw
                  false, false, false,
                  false, false, true,     # yaw rate
                  true,  true,  false]    # 线加速度（可选）
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom           # 局部链发布 odom→base_link
