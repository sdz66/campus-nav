# 云端本地开发栈（与生产同构契约，单节点模式；ADR-010）
# 用法: docker compose -f deploy/docker-compose.cloud.yml up -d
# 全量: --profile full ｜ 最小集: --profile lite（kafka/redis/postgres）
name: campus-nav-cloud

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  rocketmq:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    ports: ["9876:9876"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes

  tdengine:
    image: tdengine/tdengine:3.3.5.0
    ports: ["6030:6030", "6041:6041"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storm
      POSTGRES_PASSWORD: storm
      POSTGRES_DB: storm
    ports: ["5432:5432"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: storm
      MINIO_ROOT_PASSWORD: storm12345
    ports: ["9000:9000", "9001:9001"]

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
    ports: ["8848:8848"]

  flink-jobmanager:
    image: flink:1.20-scala_2.12-java17
    command: jobmanager
    ports: ["8081:8081"]
    profiles: ["full"]

  flink-taskmanager:
    image: flink:1.20-scala_2.12-java17
    command: taskmanager
    depends_on: [flink-jobmanager]
    profiles: ["full"]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    profiles: ["full"]
